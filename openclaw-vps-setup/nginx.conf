# ============================================================
# Nginx Reverse Proxy for OpenClaw + Malik Agent
# Replace YOUR_DOMAIN with your actual domain
# ============================================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# OpenClaw Gateway
upstream openclaw_gateway {
    server 127.0.0.1:3000;
}

# Malik Agent API
upstream malik_api {
    server 127.0.0.1:3100;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for file uploads)
    client_max_body_size 50M;

    # ── OpenClaw Web UI ──────────────────────────────────────
    location / {
        proxy_pass http://openclaw_gateway;
        proxy_http_version 1.1;

        # WebSocket support (critical for streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;

        # Long timeouts for model responses
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # ── Malik Agent API ──────────────────────────────────────
    location /malik/ {
        rewrite ^/malik/(.*) /$1 break;
        proxy_pass http://malik_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limiting for API
        limit_req zone=api burst=10 nodelay;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Malik Portal (production build) ──────────────────────
    location /portal/ {
        rewrite ^/portal/(.*) /$1 break;
        proxy_pass http://malik_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block direct access to Ollama ────────────────────────
    location /ollama/ {
        deny all;
        return 403;
    }

    # ── Health check ─────────────────────────────────────────
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
