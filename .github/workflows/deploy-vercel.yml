name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - claude/malik-zaid-agent-kRtlE
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          echo "=== Starting Vercel deployment ==="

          # Run vercel and capture all output to a file for debugging
          vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" > /tmp/vercel_output.txt 2>&1 || true

          echo "=== Full vercel output ==="
          cat /tmp/vercel_output.txt
          echo "=== End output ==="

          # Save output for artifact upload
          cp /tmp/vercel_output.txt ${{ github.workspace }}/vercel_output.txt

          # Extract URL
          URL=$(grep -oP 'https://[^\s]+\.vercel\.app[^\s]*' /tmp/vercel_output.txt | tail -1 || true)

          if [ -z "$URL" ]; then
            URL=$(grep -oP 'https://[^\s]+' /tmp/vercel_output.txt | tail -1 || true)
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT

          if [ -n "$URL" ]; then
            echo "### Deployed! :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "**Production URL:** $URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deployment failed :x:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/vercel_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-logs
          path: vercel_output.txt
          retention-days: 3

      - name: Print Result
        if: always()
        run: |
          if [ -n "${{ steps.deploy.outputs.url }}" ]; then
            echo "============================================"
            echo "  SUCCESS! URL: ${{ steps.deploy.outputs.url }}"
            echo "============================================"
          else
            echo "============================================"
            echo "  DEPLOYMENT FAILED - check artifact logs"
            echo "============================================"
            cat vercel_output.txt 2>/dev/null || true
            exit 1
          fi
