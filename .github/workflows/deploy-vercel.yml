name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - claude/malik-zaid-agent-kRtlE
  workflow_dispatch:

permissions:
  statuses: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Configure Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          vercel telemetry disable --token="$VERCEL_TOKEN" 2>/dev/null || true
          vercel link --yes --token="$VERCEL_TOKEN" 2>&1 || true

          # Get project ID
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/vtvideoyt" -o /tmp/vp.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/vp.json')).get('id',''))")
          echo "Project ID: $PROJECT_ID"

          # Disable SSO protection and set framework to null BEFORE deploy
          echo "=== Disabling SSO protection and setting framework ==="
          curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "ssoProtection": null,
              "passwordProtection": null,
              "framework": null
            }' \
            "https://api.vercel.com/v9/projects/$PROJECT_ID" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'SSO: {d.get(\"ssoProtection\")}')
          print(f'Framework: {d.get(\"framework\")}')
          " || echo "Protection update may require admin access"

          # Set environment variables
          set_env() {
            local key="$1" val="$2"
            vercel env rm "$key" production --token="$VERCEL_TOKEN" --yes 2>/dev/null || true
            echo "$val" | vercel env add "$key" production --token="$VERCEL_TOKEN" --yes 2>/dev/null || echo "$key skipped"
          }

          set_env "ANTHROPIC_API_KEY" "$ANTHROPIC_API_KEY"
          set_env "AI_MODEL" "claude-sonnet-4-20250514"
          set_env "NODE_ENV" "production"
          set_env "BASE_URL" "https://vtvideoyt.vercel.app"
          set_env "PORTAL_URL" "https://vtvideoyt.vercel.app"
          set_env "OWNER_NAME" "Ayham"
          set_env "OWNER_ALIAS" "A'Y"
          set_env "OWNER_ROLE" "Managing Partner, Co-Founder"
          set_env "OWNER_ORG" "HRMNY"
          set_env "GOOGLE_REDIRECT_URI" "https://vtvideoyt.vercel.app/api/auth/google/callback"

          for secret_key in TURSO_DATABASE_URL TURSO_AUTH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            val="${!secret_key}"
            if [ -n "$val" ]; then
              set_env "$secret_key" "$val"
            else
              echo "$secret_key not in secrets, skipping"
            fi
          done

      - name: Deploy to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          EXIT_CODE=0
          vercel deploy --prod --yes --name=vtvideoyt --token="$VERCEL_TOKEN" > /tmp/vercel_output.txt 2>&1 || EXIT_CODE=$?
          cat /tmp/vercel_output.txt
          cp /tmp/vercel_output.txt ${{ github.workspace }}/vercel_output.txt

          URL=$(grep -oP 'https://[a-zA-Z0-9_-]+\.vercel\.app' /tmp/vercel_output.txt | tail -1 || true)
          FULL_OUTPUT=$(grep -v 'telemetry' /tmp/vercel_output.txt | grep -v 'vercel.com/docs' | tr '\n' '|' | tr '"' "'" | tr '`' "'" || true)

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "chunk1=$(echo "$FULL_OUTPUT" | head -c 140)" >> $GITHUB_OUTPUT

          if [ -n "$URL" ]; then
            echo "### Deployed! :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deploy failed (exit $EXIT_CODE) :x:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/vercel_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test deployment
        if: always()
        id: test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          URL="${DEPLOY_URL:-https://vtvideoyt.vercel.app}"
          echo "Testing: $URL"
          sleep 10

          # Test health endpoint
          echo "=== Health check ==="
          HEALTH=$(curl -s -w "\nHTTP:%{http_code}" "$URL/api/health" 2>&1)
          echo "$HEALTH"
          HEALTH_CODE=$(echo "$HEALTH" | grep "HTTP:" | cut -d: -f2)
          echo "health_code=$HEALTH_CODE" >> $GITHUB_OUTPUT
          echo "health_body=$(echo "$HEALTH" | head -1 | head -c 140)" >> $GITHUB_OUTPUT

          # Test portal
          echo "=== Portal check ==="
          PORTAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" 2>&1)
          echo "Portal: HTTP $PORTAL_CODE"
          echo "portal_code=$PORTAL_CODE" >> $GITHUB_OUTPUT

          # Test agent status
          echo "=== Agent status ==="
          STATUS=$(curl -s -w "\nHTTP:%{http_code}" "$URL/api/status" 2>&1)
          echo "$STATUS"
          STATUS_CODE=$(echo "$STATUS" | grep "HTTP:" | cut -d: -f2)
          echo "status_code=$STATUS_CODE" >> $GITHUB_OUTPUT

          # Test chat (autonomous agent)
          echo "=== Chat test ==="
          CHAT=$(curl -s -w "\nHTTP:%{http_code}" -X POST "$URL/api/chat" \
            -H "Content-Type: application/json" \
            -d '{"message":"Hello Malik. Run a quick status check — what systems are you connected to and what can you do right now?"}' \
            --max-time 60 2>&1)
          echo "$CHAT"
          CHAT_CODE=$(echo "$CHAT" | grep "HTTP:" | cut -d: -f2)
          CHAT_BODY=$(echo "$CHAT" | head -1 | head -c 140)
          echo "chat_code=$CHAT_CODE" >> $GITHUB_OUTPUT
          echo "chat_body=$CHAT_BODY" >> $GITHUB_OUTPUT

          # Test auth status
          echo "=== Auth status ==="
          AUTH=$(curl -s "$URL/api/auth/status" 2>&1)
          echo "$AUTH"

      - name: Post results as commit statuses
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          HEALTH_CODE: ${{ steps.test.outputs.health_code }}
          HEALTH_BODY: ${{ steps.test.outputs.health_body }}
          PORTAL_CODE: ${{ steps.test.outputs.portal_code }}
          CHAT_CODE: ${{ steps.test.outputs.chat_code }}
          CHAT_BODY: ${{ steps.test.outputs.chat_body }}
        with:
          script: |
            const sha = context.sha;
            const {owner, repo} = context.repo;
            const url = process.env.DEPLOY_URL || '';
            const post = async (ctx, state, desc, targetUrl) => {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, state,
                description: (desc || '').substring(0, 140),
                context: ctx,
                ...(targetUrl ? {target_url: targetUrl} : {})
              });
            };

            // Deploy
            if (url && url.includes('.vercel.app')) {
              await post('vercel-deploy', 'success', `Deployed to ${url}`, url);
            } else {
              await post('vercel-deploy', 'failure', process.env.DEPLOY_EXIT || 'failed');
            }

            // Health
            const hc = process.env.HEALTH_CODE || '?';
            await post('vercel-health', hc === '200' ? 'success' : 'failure',
              `Health: HTTP ${hc} | ${process.env.HEALTH_BODY || ''}`);

            // Portal
            const pc = process.env.PORTAL_CODE || '?';
            await post('vercel-portal', ['200','304'].includes(pc) ? 'success' : 'failure',
              `Portal: HTTP ${pc}`);

            // Chat (agent test)
            const cc = process.env.CHAT_CODE || '?';
            await post('vercel-agent-chat', cc === '200' ? 'success' : 'failure',
              `Chat: HTTP ${cc} | ${process.env.CHAT_BODY || ''}`);

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-logs
          path: vercel_output.txt
          retention-days: 3

      - name: Check result
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if echo "$URL" | grep -q '.vercel.app'; then
            echo "SUCCESS: $URL"
          else
            echo "DEPLOY FAILED"
            exit 1
          fi
