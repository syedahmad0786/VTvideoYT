name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - claude/malik-zaid-agent-kRtlE
  workflow_dispatch:

permissions:
  statuses: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Disable telemetry
          vercel telemetry disable --token="$VERCEL_TOKEN" 2>/dev/null || true

          echo "=== Verifying token ==="
          vercel whoami --token="$VERCEL_TOKEN" 2>&1 || echo "WARNING: whoami failed"

          echo "=== Linking project ==="
          vercel link --yes --token="$VERCEL_TOKEN" 2>&1 || echo "WARNING: link failed"

          echo "=== Deploying to production ==="
          EXIT_CODE=0
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" > /tmp/vercel_output.txt 2>&1 || EXIT_CODE=$?

          echo "=== Vercel exit code: $EXIT_CODE ==="
          echo "=== Full output ==="
          cat /tmp/vercel_output.txt
          echo ""
          echo "=== End output ==="

          cp /tmp/vercel_output.txt ${{ github.workspace }}/vercel_output.txt

          # Extract ONLY .vercel.app URLs
          URL=$(grep -oP 'https://[a-zA-Z0-9_-]+\.vercel\.app' /tmp/vercel_output.txt | tail -1 || true)

          # Save error for commit status (sanitize for JSON safety)
          ERROR_MSG=$(grep -v 'telemetry' /tmp/vercel_output.txt | grep -v 'vercel.com/docs' | tr '\n' ' ' | tr '"' "'" | tr '`' "'" | head -c 130 || true)

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "error=$ERROR_MSG" >> $GITHUB_OUTPUT

          if [ -n "$URL" ]; then
            echo "### Deployed! :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "**Production URL:** $URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deployment failed (exit code: $EXIT_CODE) :x:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/vercel_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post result as commit status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ERROR: ${{ steps.deploy.outputs.error }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
        with:
          script: |
            const url = process.env.DEPLOY_URL || '';
            const error = process.env.DEPLOY_ERROR || '';
            const exitCode = process.env.DEPLOY_EXIT || 'unknown';
            const sha = context.sha;

            if (url && url.includes('.vercel.app')) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'success',
                target_url: url,
                description: `Deployed to ${url}`.substring(0, 140),
                context: 'vercel-deploy'
              });
            } else {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'failure',
                description: (error || `Deploy failed (exit ${exitCode})`).substring(0, 140),
                context: 'vercel-deploy'
              });
            }

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-logs
          path: vercel_output.txt
          retention-days: 3

      - name: Check result
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if echo "$URL" | grep -q '.vercel.app'; then
            echo "SUCCESS: $URL"
          else
            echo "DEPLOY FAILED"
            exit 1
          fi
