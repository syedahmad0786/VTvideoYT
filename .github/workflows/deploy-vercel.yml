name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - claude/malik-zaid-agent-kRtlE
  workflow_dispatch:

permissions:
  statuses: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Disable telemetry
          vercel telemetry disable --token="$VERCEL_TOKEN" 2>/dev/null || true

          echo "=== Verifying token ==="
          vercel whoami --token="$VERCEL_TOKEN" 2>&1 || echo "WARNING: whoami failed"

          echo "=== Linking project ==="
          vercel link --yes --token="$VERCEL_TOKEN" 2>&1 || echo "WARNING: link failed"

          echo "=== Deploying to production ==="
          EXIT_CODE=0
          vercel deploy --prod --yes --name=vtvideoyt --token="$VERCEL_TOKEN" > /tmp/vercel_output.txt 2>&1 || EXIT_CODE=$?

          echo "=== Vercel exit code: $EXIT_CODE ==="
          echo "=== Full output ==="
          cat /tmp/vercel_output.txt
          echo ""
          echo "=== End output ==="

          cp /tmp/vercel_output.txt ${{ github.workspace }}/vercel_output.txt

          # Extract ONLY .vercel.app URLs
          URL=$(grep -oP 'https://[a-zA-Z0-9_-]+\.vercel\.app' /tmp/vercel_output.txt | tail -1 || true)

          # Split full output into chunks for multiple commit statuses
          FULL_OUTPUT=$(grep -v 'telemetry' /tmp/vercel_output.txt | grep -v 'vercel.com/docs' | tr '\n' '|' | tr '"' "'" | tr '`' "'" || true)
          CHUNK1=$(echo "$FULL_OUTPUT" | head -c 140)
          CHUNK2=$(echo "$FULL_OUTPUT" | cut -c 141-280)
          CHUNK3=$(echo "$FULL_OUTPUT" | cut -c 281-420)
          CHUNK4=$(echo "$FULL_OUTPUT" | cut -c 421-560)

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "chunk1=$CHUNK1" >> $GITHUB_OUTPUT
          echo "chunk2=$CHUNK2" >> $GITHUB_OUTPUT
          echo "chunk3=$CHUNK3" >> $GITHUB_OUTPUT
          echo "chunk4=$CHUNK4" >> $GITHUB_OUTPUT

          if [ -n "$URL" ]; then
            echo "### Deployed! :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "**Production URL:** $URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deployment failed (exit code: $EXIT_CODE) :x:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/vercel_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post result as commit statuses
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit_code }}
          CHUNK1: ${{ steps.deploy.outputs.chunk1 }}
          CHUNK2: ${{ steps.deploy.outputs.chunk2 }}
          CHUNK3: ${{ steps.deploy.outputs.chunk3 }}
          CHUNK4: ${{ steps.deploy.outputs.chunk4 }}
        with:
          script: |
            const url = process.env.DEPLOY_URL || '';
            const exitCode = process.env.DEPLOY_EXIT || 'unknown';
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (url && url.includes('.vercel.app')) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha,
                state: 'success',
                target_url: url,
                description: `Deployed to ${url}`.substring(0, 140),
                context: 'vercel-deploy'
              });
            } else {
              // Post error in multiple statuses to get full output
              const chunks = [
                process.env.CHUNK1,
                process.env.CHUNK2,
                process.env.CHUNK3,
                process.env.CHUNK4
              ].filter(c => c && c.trim());

              for (let i = 0; i < chunks.length; i++) {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha,
                  state: 'failure',
                  description: chunks[i].substring(0, 140),
                  context: `vercel-deploy-log-${i + 1}`
                });
              }
            }

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-logs
          path: vercel_output.txt
          retention-days: 3

      - name: Check result
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if echo "$URL" | grep -q '.vercel.app'; then
            echo "SUCCESS: $URL"
          else
            echo "DEPLOY FAILED"
            exit 1
          fi
