name: Deploy to Vercel

on:
  push:
    branches:
      - master
      - claude/malik-zaid-agent-kRtlE
  workflow_dispatch:

permissions:
  statuses: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Disable telemetry to reduce noise
          vercel telemetry disable --token="$VERCEL_TOKEN" 2>/dev/null || true

          echo "=== Starting Vercel deployment ==="
          echo "=== Token length: ${#VERCEL_TOKEN} ==="

          # Capture exit code separately
          EXIT_CODE=0
          vercel --prod --yes --token="$VERCEL_TOKEN" > /tmp/vercel_output.txt 2>&1 || EXIT_CODE=$?

          echo "=== Vercel exit code: $EXIT_CODE ==="
          echo "=== Full output ==="
          cat /tmp/vercel_output.txt
          echo ""
          echo "=== End output ==="

          cp /tmp/vercel_output.txt ${{ github.workspace }}/vercel_output.txt

          # Extract ONLY .vercel.app URLs (not docs URLs)
          URL=$(grep -oP 'https://[a-zA-Z0-9_-]+\.vercel\.app' /tmp/vercel_output.txt | tail -1 || true)

          # Full output for commit status (filter out telemetry lines)
          ERROR_MSG=$(grep -v 'telemetry' /tmp/vercel_output.txt | grep -v 'vercel.com/docs' | tr '\n' ' ' | head -c 130 || true)

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "error=$ERROR_MSG" >> $GITHUB_OUTPUT

          if [ -n "$URL" ]; then
            echo "### Deployed! :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "**Production URL:** $URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deployment failed (exit code: $EXIT_CODE) :x:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/vercel_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post result as commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const error = `${{ steps.deploy.outputs.error }}`;
            const exitCode = '${{ steps.deploy.outputs.exit_code }}';
            const sha = context.sha;

            if (url && url.includes('.vercel.app')) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: 'success',
                target_url: url,
                description: `Deployed to ${url}`,
                context: 'vercel-deploy'
              });
            } else {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: 'failure',
                description: (error || `Deploy failed with exit code ${exitCode}`).substring(0, 140),
                context: 'vercel-deploy'
              });
            }

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-logs
          path: vercel_output.txt
          retention-days: 3

      - name: Fail if deploy failed
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ] || ! echo "$URL" | grep -q '.vercel.app'; then
            echo "Deploy failed! Full output:"
            cat vercel_output.txt 2>/dev/null || true
            exit 1
          fi
          echo "SUCCESS: $URL"
